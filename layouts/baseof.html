{{- $style := resources.Get "styles.css" | minify -}}
<!doctype html>
<html lang="{{ or site.Language.Locale }}">
    <head>
        <meta charset="utf-8" />
        <title>{{ .Title }} &ndash; {{ .Site.Title }}</title>
        {{ with $style }}<link rel="stylesheet" href="{{ .RelPermalink }}">{{ end }}
    </head>
    <body>
        <div class="site">
            {{ partial "header.html" . }} {{ block "main" . }} {{ end }}
        </div>
        {{ partial "footer.html" . }}
    </body>
</html>
